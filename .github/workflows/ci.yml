name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: CI checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.10.9"
          python-version: "3.12"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked

      - name: Check lint and formatting
        run: make lint

      - name: Run tests with coverage
        run: make cov

      - name: Build and test installed package
        run: make verify-package

      - name: Build and test Docker container
        run: make docker-test
